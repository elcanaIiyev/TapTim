<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapTim — Find Your Perfect Hackathon Team</title>
    <meta
      name="description"
      content="TapTim matches hackathon and tech-event participants into balanced teams by skills, roles, and working style."
    />
    <!--
      Inline SVG favicon, data-URI'd so it costs no request. Without any icon
      declared the browser probes /favicon.ico on every page load and logs a
      404 to the console — noise that hides real errors.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Cpath d='M9 21V11h5.2a3.4 3.4 0 0 1 0 6.8H12V21H9Zm3-5.7h2.2a1.3 1.3 0 0 0 0-2.6H12v2.6Z' fill='white'/%3E%3Ccircle cx='22.5' cy='19.5' r='2.5' fill='%2310b981'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded asynchronously: a plain stylesheet link here is render-blocking, and
      because the SPA body is empty until React mounts, a slow font response shows
      a blank page. The `media` swap lets the browser paint in the system-font
      fallback immediately and upgrade to Inter once the CSS arrives.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      Critical inline styles. The main stylesheet is injected by JS during dev,
      so without this the first paint is unstyled white even in dark mode. The
      `#root:empty` rule shows a spinner only until React mounts and fills it.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      html.dark {
        color-scheme: dark;
      }
      html {
        background: #f2f0eb;
      }
      html.dark {
        background: #0b0a08;
      }
      body {
        margin: 0;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #root:empty {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      /* A hard block that fills, not a spinner — same language as the app. */
      #root:empty::after {
        content: '';
        width: 44px;
        height: 12px;
        border: 2px solid #0b0a08;
        background: linear-gradient(to right, #ea580c 50%, transparent 50%) right / 200% 100%
          no-repeat;
        animation: taptim-load 0.9s steps(6, end) infinite;
      }
      html.dark #root:empty::after {
        border-color: #f2f0eb;
      }
      @keyframes taptim-load {
        to {
          background-position: left;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
          background-position: left;
        }
      }
    </style>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      (function () {
        try {
          var stored = localStorage.getItem('taptim-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
